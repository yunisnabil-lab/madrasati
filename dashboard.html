<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرستي — الرئيسية</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: block; padding: 48px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; max-width: 480px; }
  .card h1 { margin: 0 0 6px; font-size: 20px; }
  .card p { margin: 0; color: var(--ink-muted); font-size: 14px; }
  .role-badge { display: inline-block; margin-top: 14px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
  .signout { background: none; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 16px; font-size: 13.5px; cursor: pointer; color: var(--ink); }
</style>
</head>
<body>

  <div class="bar">
    <div class="brand-mark" style="font-size:18px;">مدرستي</div>
    <button class="signout" id="signOutBtn">تسجيل الخروج</button>
  </div>

  <div class="card">
    <h1 id="welcomeName">جاري التحميل...</h1>
    <p>تم تسجيل الدخول بنجاح. باقي الشاشات (الحضور، الطلاب، التقارير) هنبنيها في الخطوات الجاية.</p>
    <span class="role-badge" id="roleBadge"></span>
  </div>

<script src="js/lib/supabase.js"></script>
<script src="js/config.js"></script>
<script>
  const supabaseClient = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.publishableKey);

  const roleNames = { admin: 'صلاحية كاملة', recorder: 'تسجيل حضور', viewer: 'عرض فقط' };

  const staffRaw = sessionStorage.getItem('madrasati_staff');
  if (!staffRaw) {
    window.location.href = 'login.html';
  } else {
    const staff = JSON.parse(staffRaw);
    document.getElementById('welcomeName').textContent = 'أهلًا، ' + staff.full_name;
    document.getElementById('roleBadge').textContent = roleNames[staff.role] || staff.role;
  }

  document.getElementById('signOutBtn').addEventListener('click', async function () {
    await supabaseClient.auth.signOut();
    sessionStorage.removeItem('madrasati_staff');
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
