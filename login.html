<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرستي — تسجيل الدخول</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page">

    <!-- Brand pane -->
    <aside class="brand-pane">
      <div class="brand-pane-inner">

        <div class="brand-mark">
          <div class="brand-word">مدرستي</div>
          <div class="brand-sub" id="brandSub">مجمع زايد التعليمي — الخوانيج</div>
        </div>

        <div class="brand-hero">
          <div class="stat-main">
            <div class="stat-num" id="studentCount" data-target="2231">0</div>
            <div class="stat-caption" id="statCaption">طالب مسجّل حاليًا</div>
          </div>
        </div>

        <div class="brand-foot" id="brandFoot">
          نظام إدارة مدرسي متكامل — حضور وغياب، تقارير، صلاحيات
        </div>

      </div>
    </aside>

    <!-- Form pane -->
    <main class="form-pane">

      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button type="button" class="lang-opt is-active" data-lang="ar" id="langAr">عربي</button>
        <button type="button" class="lang-opt" data-lang="en" id="langEn">English</button>
        <span class="lang-thumb" id="langThumb"></span>
      </div>

      <div class="form-wrap">
        <div class="form-head">
          <h1 id="titleText">تسجيل الدخول</h1>
          <p id="subtitleText">أدخل بيانات حسابك للوصول إلى النظام</p>
        </div>

        <div class="error-box" id="errorBox" role="alert" aria-live="polite"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email" id="emailLabel">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="username">
          </div>

          <div class="field">
            <label for="password" id="passwordLabel">كلمة المرور</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <div class="field-row">
            <label class="remember">
              <input type="checkbox" id="rememberMe">
              <span id="rememberLabel">تذكرني</span>
            </label>
            <button type="button" class="forgot-link" id="forgotLink">نسيت كلمة المرور؟</button>
          </div>

          <div class="forgot-note" id="forgotNote"></div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <span id="submitLabel">دخول</span>
            <span class="spinner" id="submitSpinner" aria-hidden="true"></span>
          </button>
        </form>

        <div class="form-foot" id="footText">
          مشكلة في الدخول؟ تواصل مع إدارة المدرسة
        </div>
      </div>
    </main>

  </div>

<script src="js/lib/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n-login.js"></script>
<script src="js/app-login.js"></script>
</body>
</html>
