<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرستي — الرئيسية</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark">م</div>
      <div class="name">مدرستي<span id="sbSchool">مجمع زايد التعليمي</span></div>
    </div>

    <nav class="nav-group">
      <div class="nav-group-label" id="navMainLabel">الرئيسية</div>
      <button class="nav-item is-active" type="button">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg></i>
        <span id="navDashboard">لوحة التحكم</span>
      </button>
      <button class="nav-item" type="button">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 20c0-3.6 2.5-6 5.5-6s5.5 2.4 5.5 6"></path><circle cx="17" cy="8.5" r="2.6"></circle><path d="M15.5 14.3c2.6.4 4.5 2.5 4.5 5.7"></path></svg></i>
        <span id="navStudents">الطلاب</span>
      </button>
      <button class="nav-item" type="button">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><path d="M3.5 9.5h17"></path><path d="M8 3v3M16 3v3"></path><path d="M7.5 13.5l2 2 4-4"></path></svg></i>
        <span id="navAttendance">الحضور والغياب</span>
      </button>
      <button class="nav-item" type="button">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg></i>
        <span id="navReports">التقارير</span>
      </button>
    </nav>

    <nav class="nav-group">
      <div class="nav-group-label" id="navSystemLabel">النظام</div>
      <button class="nav-item" type="button">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 00-1.7-1L15 3.5h-4l-.3 2.6a7.7 7.7 0 00-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.4 2.4-1a7.7 7.7 0 001.7 1l.3 2.6h4l.3-2.6a7.7 7.7 0 001.7-1l2.4 1 2-3.4-2-1.5z"></path></svg></i>
        <span id="navSettings">الإعدادات</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="sbAvatar">--</div>
        <div class="who">
          <div class="n" id="sbName">جاري التحميل...</div>
          <div class="r" id="sbRole"></div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="pageTitle">لوحة التحكم</h1>
        <p id="pageDate"></p>
      </div>

      <div class="topbar-search">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg></i>
        <input type="text" id="searchInput" placeholder="بحث عن طالب، فصل...">
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" type="button" aria-label="notifications">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 00-12 0c0 4.5-2 5.5-2 5.5h16s-2-1-2-5.5"></path><path d="M10 18a2 2 0 004 0"></path></svg></i>
          <span class="dot"></span>
        </button>
        <button class="lang-opt" id="langBtn" type="button" style="border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:500;color:var(--ink-muted)">English</button>
        <button class="icon-btn" id="signOutBtn" type="button" aria-label="sign out">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4H7a2 2 0 00-2 2v12a2 2 0 002 2h8"></path><path d="M10 12h11M17 8l4 4-4 4"></path></svg></i>
        </button>
      </div>
    </header>

    <div class="content">

      <div class="stat-grid">
        <div class="metric-card">
          <div class="m-label" id="mLabelStudents">إجمالي الطلاب</div>
          <div class="m-value" id="mStudents"><span class="skeleton" style="display:inline-block;width:60px;height:30px"></span></div>
        </div>
        <div class="metric-card">
          <div class="m-label" id="mLabelStaff">أعضاء الهيئة</div>
          <div class="m-value" id="mStaff"><span class="skeleton" style="display:inline-block;width:60px;height:30px"></span></div>
        </div>
        <div class="metric-card">
          <div class="m-label" id="mLabelSections">الفصول الدراسية</div>
          <div class="m-value" id="mSections"><span class="skeleton" style="display:inline-block;width:60px;height:30px"></span></div>
        </div>
      </div>

      <div class="panel-grid">
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2 id="chartTitle">توزيع الطلاب حسب الصف</h2>
              <p id="chartSub">عدد الطلاب المسجلين في كل صف دراسي</p>
            </div>
          </div>
          <div class="bar-chart" id="barChart"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h2 id="tableTitle">أحدث الطلاب المضافين</h2>
              <p id="tableSub" style="display:none"></p>
            </div>
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th id="thName">الاسم</th>
                <th id="thSection">الفصل</th>
              </tr>
            </thead>
            <tbody id="recentStudentsBody">
              <tr><td colspan="2"><span class="skeleton" style="display:block;width:100%;height:16px"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="js/lib/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n-dashboard.js"></script>
<script src="js/app-dashboard.js"></script>
</body>
</html>
